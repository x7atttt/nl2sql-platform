# ============================================================================
# 构建 Docker 镜像并推送到阿里云 ACR
# ============================================================================
# 触发条件：push 到 main 分支 / 手动触发
# 构建产物：backend + frontend 两个镜像（并行构建）
# 推送目标：阿里云 ACR（需配置 Secrets）
#
# 需要的 GitHub Secrets（仓库 Settings → Secrets and variables → Actions）：
#   ACR_REGISTRY   阿里云 ACR 公网地址（如 crpi-xxxxx.cn-guangzhou.personal.cr.aliyuncs.com）
#   ACR_NAMESPACE  命名空间/仓库名（如 your-namespace/nl2sql）
#   ACR_USERNAME   阿里云账号全名（如 nick0797263319）
#   ACR_PASSWORD   ACR 访问凭证密码（开通服务时设置的密码）
# ============================================================================
name: Build and Push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:    # 支持在 Actions 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # backend 和 frontend 并行构建（matrix 各跑一个 job，省时间）
      matrix:
        include:
          - context: .
            dockerfile: ./Dockerfile
            tag: backend      # django + celery-worker + celery-beat 共用同一镜像
          - context: ./frontend
            dockerfile: ./frontend/Dockerfile
            tag: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # 启用 BuildKit，支持 --mount=type=cache 和 cache-from/to
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        # 用 Secrets 登录 ACR，密码不会出现在日志和代码里
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # 每次构建推两个 tag：
          #   - {tag}-latest：服务器 docker compose pull 默认拉这个
          #   - {tag}-{commit sha}：版本回滚用（每次 commit 一个独立 tag）
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}:${{ matrix.tag }}-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}:${{ matrix.tag }}-${{ github.sha }}
          # GitHub Actions 缓存：二次构建复用 pip/pnpm 下载，省时间
          cache-from: type=gha
          cache-to: type=gha,mode=max
