# 生产部署：docker compose --env-file .env.production up -d
# 本地开发：docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# 镜像地址走环境变量（ACR_VPC_DOMAIN / ACR_NAMESPACE），仓库里不暴露 ACR 真实域名。
# 在 .env.production 配置：ACR_VPC_DOMAIN、ACR_NAMESPACE
services:
  django:
    restart: unless-stopped
    image: ${ACR_VPC_DOMAIN}/${ACR_NAMESPACE}:backend-latest
    # collectstatic 已移到构建期（Dockerfile），启动只跑 migrate
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    restart: unless-stopped
    image: ${ACR_VPC_DOMAIN}/${ACR_NAMESPACE}:backend-latest
    command: celery -A config worker -l info --concurrency=2 --max-tasks-per-child=100
    volumes:
      - media_data:/app/media
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    restart: unless-stopped
    image: ${ACR_VPC_DOMAIN}/${ACR_NAMESPACE}:backend-latest
    command: celery -A config beat -l info
    env_file:
      - .env.production
    depends_on:
      django:           # 修复：beat 依赖 django_celery_beat 迁移表，需等 django migrate 完成
        condition: service_started
      redis:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    image: ${ACR_VPC_DOMAIN}/${ACR_NAMESPACE}:frontend-latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - django

  db:
    restart: unless-stopped
    # pgvector 镜像：官方 postgres:15 + 预装 vector 扩展（few-shot 语义检索依赖）
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-data_platform}
      POSTGRES_USER: ${DB_USER:-data_platform_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-data_platform_user}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
