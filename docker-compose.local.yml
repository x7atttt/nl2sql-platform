# 本地开发覆盖文件：用 build 替代 ACR 镜像
# 启动命令：docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# 这个文件覆盖 docker-compose.yml 里的 image 字段，改用本地构建。
# 不需要 ACR 环境变量（ACR_VPC_DOMAIN / ACR_NAMESPACE 可不配）。

services:
  django:
    build: .
    image: nl2sql-backend:local

  celery-worker:
    build: .
    image: nl2sql-backend:local

  celery-beat:
    build: .
    image: nl2sql-backend:local

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nl2sql-frontend:local
